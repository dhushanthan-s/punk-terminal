[workspace]
resolver = "3"
members = ["punk", "punk_gui", "punk_terminal", "punk_utils"]

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dhushanthan-s/punk-terminal"
homepage = "https://github.com/dhushanthan-s/punk-terminal"

[workspace.dependencies]
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
winit = "0.30"
wgpu = "23"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
fontdue = "0.9"
vte = "0.15"
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Build each shipped app on its own (`cargo build -p <pkg>`) instead of the whole
# workspace, so the non-shipped legacy `punk` crate is not compiled during release.
precise-builds = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# Build linux-arm64 natively on GitHub's free ARM runner (avoids cross-linking)
[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
