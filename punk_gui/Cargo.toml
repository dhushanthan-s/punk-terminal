[package]
name = "punk_gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AI powered Rust terminal with an integrated multiplexer"
readme = "../README.md"
autobins = false

[[bin]]
name = "punk"
path = "src/main.rs"

# Only this crate produces a distributable release artifact (the `punk` binary).
[package.metadata.dist]
dist = true

[dependencies]
bytemuck = { workspace = true }
fontdue = { workspace = true }
pollster = { workspace = true }
punk_terminal = { path = "../punk_terminal" }
punk_utils = { path = "../punk_utils" }
vte = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
