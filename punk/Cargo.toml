[package]
name = "punk"
authors = ["Suganth R", "Dhushanthan S"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "punk-legacy"
path = "src/main.rs"

# Legacy binary: not part of the distributed release (see punk_gui for the shipped `punk`).
[package.metadata.dist]
dist = false

[dependencies]
libc = "0.2"

[dependencies.punk_terminal]
path = "../punk_terminal"
version = "*"

[dependencies.punk_utils]
path = "../punk_utils"
version = "*"
